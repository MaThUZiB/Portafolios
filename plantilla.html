<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>CV - Iván Matus Angulo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background: #f5f5f5;
            color: #1a1a1a;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        /* ================= CV CONTAINER ================= */
        .cv {
            width: 210mm;
            min-height: 297mm;
            background: #ffffff;
            overflow: hidden;
        }

        /* ================= HEADER ================= */
        .header {
            background: #1a2332;
            padding: 28px 36px 24px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 24px;
        }

        .header-left {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .profile {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .profile img {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #4a5568;
            flex-shrink: 0;
        }

        .profile-info h1 {
            font-size: 24px;
            color: #ffffff;
            font-weight: 700;
            letter-spacing: 0.5px;
            line-height: 1.2;
            margin: 0;
            font-family: 'Georgia', serif;
        }

        .titles {
            font-size: 11px;
            color: #a0aec0;
            line-height: 1.5;
            margin-top: 4px;
            font-family: 'Arial', sans-serif;
        }

        /* ================= CONTACT ================= */
        .contact-section {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 4px;
            padding: 14px 18px;
            min-width: 220px;
        }

        .contact-section h3 {
            color: #e2e8f0;
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            margin-bottom: 10px;
            font-family: 'Arial', sans-serif;
            font-weight: 600;
        }

        .contact-section ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .contact-section li {
            font-size: 10.5px;
            color: #cbd5e0;
            margin-bottom: 5px;
            padding: 0;
            display: flex;
            align-items: center;
            gap: 6px;
            line-height: 1.4;
            font-family: 'Arial', sans-serif;
        }

        .contact-section li:last-child {
            margin-bottom: 0;
        }

        /* ================= CONTENT AREA ================= */
        .content {
            padding: 24px 36px 20px;
        }

        /* ================= SECTIONS ================= */
        .section {
            margin-bottom: 20px;
            page-break-inside: avoid;
        }

        .section h2 {
            font-size: 12px;
            color: #1a2332;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 2px solid #1a2332;
            padding-bottom: 6px;
            margin-bottom: 14px;
            font-weight: 700;
            font-family: 'Arial', sans-serif;
        }

        /* ================= ABOUT ================= */
        .about {
            background: #f8f9fa;
            padding: 14px 18px;
            border-radius: 4px;
            font-size: 11px;
            line-height: 1.6;
            color: #2d3748;
            text-align: justify;
            border-left: 3px solid #1a2332;
            font-family: 'Arial', sans-serif;
            page-break-inside: avoid;
        }

        .about p {
            margin-bottom: 8px;
        }

        .about p:last-child {
            margin-bottom: 0;
        }

        /* ================= TWO COLUMNS ================= */
        .two-columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 0;
        }

        .two-columns > div {
            min-width: 0;
        }

        /* ================= CARDS ================= */
        .card {
            background: #ffffff;
            padding: 12px 14px;
            border-radius: 4px;
            margin-bottom: 10px;
            border: 1px solid #e2e8f0;
            border-left: 3px solid #2d3748;
            page-break-inside: avoid;
        }

        .card h3,
        .card strong {
            font-size: 11.5px;
            color: #1a2332;
            font-weight: 700;
            display: block;
            margin-bottom: 3px;
            font-family: 'Arial', sans-serif;
        }

        .card p {
            font-size: 10.5px;
            color: #4a5568;
            line-height: 1.4;
            margin-bottom: 2px;
            font-family: 'Arial', sans-serif;
        }

        .card p:last-child {
            margin-bottom: 0;
        }

        .muted {
            font-size: 10px;
            color: #718096;
        }

        /* ================= PROJECTS ================= */
        .projects-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        /* ================= CERTIFICATIONS ================= */
        .cert-grid {
            list-style: none;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            padding: 0;
            margin: 0;
        }

        .cert-item {
            background: #ffffff;
            padding: 10px 12px 10px 16px;
            border-radius: 4px;
            border: 1px solid #e2e8f0;
            border-left: 3px solid #2d3748;
            display: flex;
            flex-direction: column;
            gap: 2px;
            page-break-inside: avoid;
        }

        .cert-item strong {
            font-size: 11px;
            color: #1a2332;
            font-weight: 700;
            font-family: 'Arial', sans-serif;
        }

        .cert-item span {
            font-size: 10px;
            color: #4a5568;
            font-family: 'Arial', sans-serif;
        }

        /* ================= FOOTER ================= */
        .cv-footer {
            margin-top: 28px;
            padding-top: 12px;
            border-top: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            font-size: 9px;
            color: #718096;
            font-family: 'Arial', sans-serif;
        }

        /* ================= PRINT STYLES ================= */
        @page {
            size: A4;
            margin: 0;
        }

        @media print {
            body {
                background: white;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            .cv {
                background: white;
                color: black;
                box-shadow: none;
                width: 100%;
                min-height: auto;
            }

            .header {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                background: #1a2332 !important;
            }

            .about {
                background: #f8f9fa !important;
            }

            .section {
                page-break-inside: avoid;
            }

            .card {
                page-break-inside: avoid;
            }

            .cert-item {
                page-break-inside: avoid;
            }

            .two-columns > div > * {
                page-break-inside: avoid;
            }
        }
    </style>
</head>

<body>

<div class="cv" id="cv-content">

    <!-- HEADER -->
    <header class="header">

        <div class="header-left">
            <div class="profile">
                <img src="{{profileImage}}" alt="Perfil">
                <div class="profile-info">
                    <h1>{{name}}</h1>
                    <p class="titles">
                        {{titles}}
                    </p>
                </div>
            </div>
        </div>

        <div class="contact-section">
            <h3>Contacto</h3>
            <ul>
                {{contact}}
            </ul>
        </div>

    </header>

    <div class="content">

        <!-- ABOUT -->
        <section class="section">
            <h2>Acerca de mí</h2>
            <div class="about">
                {{about}}
            </div>
        </section>

        <!-- EDUCATION + EXPERIENCE -->
        <section class="section two-columns">

            <div>
                <h2>Educación</h2>
                {{education}}
            </div>

            <div>
                <h2>Experiencia</h2>
                {{experience}}
            </div>

        </section>

        <!-- PROJECTS -->
        <section class="section">
            <h2>Proyectos</h2>
            <div class="projects-grid">
                {{projects}}
            </div>
        </section>

        <!-- CERTIFICATIONS -->
        <section class="section">
            <h2>Certificaciones</h2>

            <ul class="cert-grid">
                {{certifications}}
            </ul>
        </section>

        <!-- FOOTER -->
        <div class="cv-footer">
            <span>{{name}} • CV</span>
            <span>ivanmatus204@gmail.com | +56 9 9945 5574</span>
            <span>Generado desde mi portafolio web</span>
        </div>

    </div>

</div>

</body>
</html>
